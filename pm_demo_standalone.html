<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
.header { background: #1f77b4; color: white; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.header h1 { font-size: 24px; font-weight: 600; }
.summary-cards { display: flex; gap: 16px; flex-wrap: wrap; }
.summary-card { background: rgba(255,255,255,0.15); border-radius: 8px; padding: 12px 20px; text-align: center; min-width: 120px; }
.summary-card .num { font-size: 28px; font-weight: 700; }
.summary-card .lbl { font-size: 11px; text-transform: uppercase; opacity: 0.85; }
.controls { padding: 16px 32px; background: white; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 16px; }
.controls label { font-weight: 600; font-size: 14px; }
.controls select { padding: 8px 16px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; min-width: 280px; }
.domain-tabs { display: flex; background: white; border-bottom: 2px solid #e0e0e0; padding: 0 32px; overflow-x: auto; }
.domain-tab { padding: 14px 20px; cursor: pointer; font-size: 13px; font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; transition: all 0.2s; }
.domain-tab:hover { background: #f0f4f8; }
.domain-tab.active { border-bottom-color: #1f77b4; color: #1f77b4; font-weight: 600; }
.feature-tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; padding: 0 32px; overflow-x: auto; }
.feature-tab { padding: 10px 16px; cursor: pointer; font-size: 12px; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s; color: #666; }
.feature-tab:hover { color: #333; background: #eef2f6; }
.feature-tab.active { border-bottom-color: #1f77b4; color: #1f77b4; }
.content { padding: 24px 32px; max-width: 1400px; }
.domain-panel { display: none; }
.domain-panel.active { display: block; }
.feature-panel { display: none; }
.feature-panel.active { display: block; }
.metric-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.metric-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
.metric-card .value { font-size: 28px; font-weight: 700; color: #1f77b4; }
.metric-card .label { font-size: 12px; color: #888; text-transform: uppercase; margin-top: 4px; }
.chart-container { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
.chart-container h3 { margin-bottom: 16px; font-size: 16px; color: #333; }
.chart-wrap { position: relative; height: 300px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
table th { background: #f0f4f8; padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; position: sticky; top: 0; }
table td { padding: 9px 12px; border-bottom: 1px solid #eee; }
table tr:nth-child(even) { background: #fafbfc; }
table tr:hover { background: #f0f7ff; }
.table-wrap { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; overflow-x: auto; }
.table-wrap h3 { margin-bottom: 12px; font-size: 16px; }
.placeholder-panel { background: white; border-radius: 10px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
.placeholder-panel h3 { color: #1f77b4; margin-bottom: 12px; }
.placeholder-panel p { color: #666; max-width: 600px; margin: 0 auto; line-height: 1.6; }
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.status-current { background: #d4edda; color: #155724; }
.status-due { background: #fff3cd; color: #856404; }
.status-overdue { background: #f8d7da; color: #721c24; }
.calculator { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.calculator h3 { margin-bottom: 20px; }
.calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.calc-inputs { display: flex; flex-direction: column; gap: 16px; }
.calc-inputs label { font-size: 13px; font-weight: 500; display: flex; flex-direction: column; gap: 4px; }
.calc-inputs input[type="range"] { width: 100%; }
.calc-results { display: flex; flex-direction: column; gap: 12px; }
.calc-result-card { padding: 16px; border-radius: 8px; text-align: center; }
.calc-result-card.independent { background: #e8f4fd; border: 1px solid #b8dff5; }
.calc-result-card.franchise { background: #fff8e1; border: 1px solid #ffe082; }
.calc-result-card .val { font-size: 24px; font-weight: 700; }
.calc-result-card .lbl { font-size: 12px; color: #666; margin-top: 4px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } .calc-grid { grid-template-columns: 1fr; } }
</style>
</head>

let currentProperty = 'P001';
let currentDomain = 'ops';
let currentFeature = 'f01';
let charts = {};

function fmt(n) { return n.toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function fmtUSD(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function destroyCharts() {
  Object.values(charts).forEach(c => { if (c) c.destroy(); });
  charts = {};
}

function initPropertySelector() {
  const sel = document.getElementById('propSelect');
  window.DATA.properties.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.name} (${p.city}, ${p.state}) - ${p.rooms} rooms - ${p.class}`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    currentProperty = sel.value;
    renderCurrentView();
  });
}

function initDomainTabs() {
  const container = document.getElementById('domainTabs');
  DOMAINS.forEach(d => {
    const tab = document.createElement('div');
    tab.className = 'domain-tab' + (d.id === currentDomain ? ' active' : '');
    tab.textContent = d.name;
    tab.dataset.domain = d.id;
    tab.addEventListener('click', () => {
      currentDomain = d.id;
      currentFeature = DOMAINS.find(x => x.id === d.id).features[0].id;
      renderDomainTabs();
      renderFeatureTabs();
      renderCurrentView();
    });
    container.appendChild(tab);
  });
}

function renderDomainTabs() {
  document.querySelectorAll('.domain-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.domain === currentDomain);
  });
}

function renderFeatureTabs() {
  const container = document.getElementById('featureTabs');
  container.innerHTML = '';
  const domain = DOMAINS.find(d => d.id === currentDomain);
  domain.features.forEach(f => {
    const tab = document.createElement('div');
    tab.className = 'feature-tab' + (f.id === currentFeature ? ' active' : '');
    tab.textContent = f.name;
    tab.dataset.feature = f.id;
    tab.addEventListener('click', () => {
      currentFeature = f.id;
      renderFeatureTabs();
      renderCurrentView();
    });
    container.appendChild(tab);
  });
}

function renderCurrentView() {
  destroyCharts();
  const content = document.getElementById('mainContent');
  const renderers = {
    f01: renderF01, f02: renderF02, f03: renderF03, f04: renderF04,
    f05: renderF05, f06: renderF06, f07: renderF07, f08: renderF08,
    f09: renderF09, f10: renderF10, f11: renderF11,
    f12: renderF12, f13: renderF13, f14: renderF14, f15: renderF15,
    f16: renderF16, f17: renderF17, f18: renderF18,
    f19: renderF19, f20: renderF20
  };
  if (renderers[currentFeature]) {
    content.innerHTML = '';
    renderers[currentFeature](content);
  }
}

function renderF01(container) {
  const data = window.DATA.channel_mix[currentProperty];
  const totalRes = data.reduce((s, d) => s + d.count, 0);
  const avgRate = data.reduce((s, d) => s + d.avg_rev * d.count, 0) / totalRes;
  const topChannel = data[0].channel;
  const totalRev = data.reduce((s, d) => s + d.avg_rev * d.count, 0);

  container.innerHTML = `
    <div class="metric-cards">
      <div class="metric-card"><div class="value">${fmt(totalRes)}</div><div class="label">Total Reservations</div></div>
      <div class="metric-card"><div class="value">${fmtUSD(avgRate)}</div><div class="label">Avg Rate</div></div>
      <div class="metric-card"><div class="value">${topChannel}</div><div class="label">Top Channel</div></div>
      <div class="metric-card"><div class="value">${fmtUSD(totalRev)}</div><div class="label">Est. Gross Revenue</div></div>
    </div>
    <div class="chart-container"><h3>Reservations by Channel</h3><div class="chart-wrap"><canvas id="chartF01"></canvas></div></div>
    <div class="table-wrap"><h3>Channel Mix Details</h3>
      <table><thead><tr><th>Channel</th><th>Reservations</th><th>Avg Revenue</th><th>% of Total</th></tr></thead>
      <tbody>${data.map(d => `<tr><td>${d.channel}</td><td>${fmt(d.count)}</td><td>${fmtUSD(d.avg_rev)}</td><td>${(d.count/totalRes*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>
    </div>`;

  charts.f01 = new Chart(document.getElementById('chartF01'), {
    type: 'bar',
    data: { labels: data.map(d => d.channel), datasets: [{ label: 'Reservations', data: data.map(d => d.count), backgroundColor: '#1f77b4' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

function renderF02(container) {
  const data = window.DATA.channel_mix[currentProperty];

}

function renderF08(container) {
  const prop = window.DATA.properties.find(p => p.id === currentProperty);
  container.innerHTML = `
    <div class="calculator">
      <h3>Franchise vs Independent ROI Calculator</h3>
      <div class="calc-grid">
        <div class="calc-inputs">
          <label>Rooms: <span id="calcRoomsVal">${prop.rooms}</span><input type="range" id="calcRooms" min="20" max="120" value="${prop.rooms}"></label>
          <label>ADR ($): <span id="calcADRVal">95</span><input type="range" id="calcADR" min="50" max="200" value="95"></label>
          <label>Occupancy (%): <span id="calcOccVal">70</span><input type="range" id="calcOcc" min="40" max="95" value="70"></label>
          <label>Franchise Fee (%): <span id="calcFeeVal">6</span><input type="range" id="calcFee" min="4" max="8" step="0.5" value="6"></label>
        </div>
        <div class="calc-results" id="calcResults"></div>
      </div>
    </div>`;

  function updateCalc() {
    const rooms = +document.getElementById('calcRooms').value;
    const adr = +document.getElementById('calcADR').value;
    const occ = +document.getElementById('calcOcc').value / 100;
    const fee = +document.getElementById('calcFee').value / 100;

    document.getElementById('calcRoomsVal').textContent = rooms;
    document.getElementById('calcADRVal').textContent = adr;
    document.getElementById('calcOccVal').textContent = document.getElementById('calcOcc').value;
    document.getElementById('calcFeeVal').textContent = document.getElementById('calcFee').value;

    const annualRevenue = rooms * adr * occ * 365;
    const franchiseCost = annualRevenue * fee;
    const indMarketing = annualRevenue * 0.04;
    const indNet = annualRevenue - indMarketing;
    const franNet = annualRevenue - franchiseCost;
    const diff = indNet - franNet;

    document.getElementById('calcResults').innerHTML = `
      <div style="font-size:13px;color:#666;margin-bottom:8px;">Annual Room Revenue: <strong>${fmtUSD(annualRevenue)}</strong></div>
      <div class="calc-result-card independent">
        <div class="lbl">Independent Net Revenue</div>
        <div class="val" style="color:#1f77b4;">${fmtUSD(indNet)}</div>
        <div class="lbl">Marketing cost: ${fmtUSD(indMarketing)} (4%)</div>
      </div>
      <div class="calc-result-card franchise">
        <div class="lbl">Franchise Net Revenue</div>
        <div class="val" style="color:#e67e22;">${fmtUSD(franNet)}</div>
        <div class="lbl">Franchise fee: ${fmtUSD(franchiseCost)} (${(fee*100).toFixed(1)}%)</div>
      </div>
      <div style="text-align:center;padding:12px;font-size:14px;font-weight:600;color:${diff > 0 ? '#28a745' : '#dc3545'}">
        Independent ${diff > 0 ? 'saves' : 'costs'} ${fmtUSD(Math.abs(diff))} /year
      </div>`;
  }

  ['calcRooms','calcADR','calcOcc','calcFee'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateCalc);
  });
  updateCalc();
}

        <tbody>${data.map(d => `<tr><td>${d.status.replace(/_/g,' ')}</td><td>${d.cnt}</td><td>${(d.cnt/total*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>
      </div>
    </div>`;

  charts.f17 = new Chart(document.getElementById('chartF17'), {
    type: 'doughnut',
    data: { labels: data.map(d => d.status.replace(/_/g,' ')), datasets: [{ data: data.map(d => d.cnt), backgroundColor: data.map(d => statusColors[d.status] || '#999') }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
}

function renderF18(container) {
  const extData = window.DATA.extended_stay[currentProperty];
  const evictions = extData.find(d => d.status === 'EVICTION');
  const incidentCount = evictions ? evictions.cnt + 3 : 4;

  container.innerHTML = `
    <div class="metric-cards">
      <div class="metric-card"><div class="value">${incidentCount}</div><div class="label">Open Claims</div></div>
      <div class="metric-card"><div class="value">2</div><div class="label">Pending Review</div></div>
      <div class="metric-card"><div class="value">$12,450</div><div class="label">Est. Exposure</div></div>
    </div>
    <div class="placeholder-panel">
      <h3>Insurance & Claims Management</h3>
      <p>This module tracks property damage incidents, guest injury reports, liability claims, and insurance policy status. It integrates with the maintenance system to correlate asset failures with potential claims and provides documentation workflows for efficient claims processing.</p>
      <p style="margin-top:12px;color:#888;">Features: incident reporting, photo documentation, adjuster communication, policy renewal tracking, premium optimization analysis.</p>
    </div>`;
}

function renderF19(container) {
  const data = window.DATA.benchmarking[currentProperty];
  const metricLabels = {
    adr_usd: 'ADR ($)', direct_booking_pct: 'Direct Booking %', energy_cost_per_room: 'Energy $/Room',
    expense_per_room_usd: 'Expense $/Room', labor_cost_pct: 'Labor Cost %',
    occupancy_pct: 'Occupancy %', review_score_avg: 'Review Score', revpar_usd: 'RevPAR ($)'
  };

  container.innerHTML = `
    <div class="metric-cards">
      <div class="metric-card"><div class="value">${data.length}</div><div class="label">Metrics Tracked</div></div>
      <div class="metric-card"><div class="value">${data.filter(d => d.my_value >= d.p75).length}</div><div class="label">Above P75</div></div>
      <div class="metric-card"><div class="value">${data.filter(d => d.my_value < d.p25).length}</div><div class="label">Below P25</div></div>
    </div>
    <div class="chart-container"><h3>My Property vs Cohort Benchmarks</h3><div class="chart-wrap"><canvas id="chartF19"></canvas></div></div>
    <div class="table-wrap"><h3>Benchmark Details</h3>
      <table><thead><tr><th>Metric</th><th>My Value</th><th>P25</th><th>Median</th><th>P75</th><th>Position</th></tr></thead>
      <tbody>${data.map(d => {
        let pos = d.my_value >= d.p75 ? '<span style="color:#28a745;font-weight:600">Above P75</span>' :
                  d.my_value >= d.median ? '<span style="color:#1f77b4">Above Median</span>' :
                  d.my_value >= d.p25 ? '<span style="color:#ffc107">Below Median</span>' :
                  '<span style="color:#dc3545;font-weight:600">Below P25</span>';
        return `<tr><td>${metricLabels[d.metric] || d.metric}</td><td><strong>${d.my_value}</strong></td><td>${d.p25}</td><td>${d.median}</td><td>${d.p75}</td><td>${pos}</td></tr>`;
      }).join('')}</tbody></table>
    </div>`;

  charts.f19 = new Chart(document.getElementById('chartF19'), {
    type: 'bar',
    data: {
      labels: data.map(d => metricLabels[d.metric] || d.metric),
      datasets: [
        { label: 'My Value', data: data.map(d => d.my_value), backgroundColor: '#1f77b4' },
        { label: 'Median', data: data.map(d => d.median), backgroundColor: '#aec7e8' },
        { label: 'P75', data: data.map(d => d.p75), backgroundColor: '#c7c7c7' }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
  });
}

function renderF20(container) {
  const data = window.DATA.purchases[currentProperty];
  const catalog = window.DATA.coop_catalog;
  const totalSpend = data.reduce((s, d) => s + d.spend, 0);
  const colors = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2'];

  container.innerHTML = `
    <div class="metric-cards">
      <div class="metric-card"><div class="value">${fmtUSD(totalSpend)}</div><div class="label">Total Purchases</div></div>
      <div class="metric-card"><div class="value">${data.length}</div><div class="label">Categories</div></div>
      <div class="metric-card"><div class="value">${catalog.length}</div><div class="label">Co-op Items</div></div>
      <div class="metric-card"><div class="value">${fmtUSD(data[0].spend)}</div><div class="label">Top: ${data[0].category}</div></div>
    </div>
    <div class="two-col">
      <div class="chart-container"><h3>Purchase Spend by Category</h3><div class="chart-wrap"><canvas id="chartF20"></canvas></div></div>
      <div class="table-wrap"><h3>Spend Breakdown</h3>
        <table><thead><tr><th>Category</th><th>Spend</th><th>% of Total</th></tr></thead>
        <tbody>${data.map(d => `<tr><td>${d.category}</td><td>${fmtUSD(d.spend)}</td><td>${(d.spend/totalSpend*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>
      </div>
    </div>
    <div class="table-wrap"><h3>Co-op Catalog</h3>
      <table><thead><tr><th>ID</th><th>Category</th><th>Item</th><th>Brand</th><th>Price</th></tr></thead>
      <tbody>${catalog.map(d => `<tr><td>${d.id}</td><td>${d.category}</td><td>${d.item}</td><td>${d.brand}</td><td>${fmtUSD(d.price)}</td></tr>`).join('')}</tbody></table>
    </div>`;

  charts.f20 = new Chart(document.getElementById('chartF20'), {
    type: 'bar',
    data: {
      labels: data.map(d => d.category),
      datasets: [{ label: 'Spend', data: data.map(d => d.spend), backgroundColor: colors.slice(0, data.length) }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

// Initialize
initPropertySelector();
initDomainTabs();
renderFeatureTabs();
renderCurrentView();
</script>
</body>
