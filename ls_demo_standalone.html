header { background: #722F37; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

.tabs { display: flex; background: #fff; border-bottom: 2px solid #e0e0e0; padding: 0 24px; overflow-x: auto; }
.tab { padding: 12px 20px; cursor: pointer; font-size: 0.85rem; font-weight: 500; color: #666; border-bottom: 3px solid transparent; white-space: nowrap; transition: all 0.2s; }
.tab:hover { color: #722F37; }
.tab.active { color: #722F37; border-bottom-color: #722F37; }
.content { padding: 24px; max-width: 1400px; margin: 0 auto; }
.page { display: none; }
.page.active { display: block; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.metric-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.metric-card .label { font-size: 0.75rem; text-transform: uppercase; color: #888; margin-bottom: 4px; letter-spacing: 0.5px; }
.metric-card .value { font-size: 1.5rem; font-weight: 700; color: #333; }
.metric-card .sub { font-size: 0.75rem; color: #888; margin-top: 4px; }
.metric-card.red { border-left: 4px solid #dc3545; }
.metric-card.orange { border-left: 4px solid #fd7e14; }
.metric-card.yellow { border-left: 4px solid #ffc107; }
.metric-card.green { border-left: 4px solid #28a745; }
.chart-container { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
.chart-container h3 { font-size: 0.9rem; color: #555; margin-bottom: 12px; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
@media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.table-wrap { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; overflow-x: auto; }
.table-wrap h3 { font-size: 0.9rem; color: #555; margin-bottom: 12px; }
table th { background: #f8f8f8; padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0; white-space: nowrap; }
table td { padding: 8px 12px; border-bottom: 1px solid #eee; }
table tr:nth-child(even) { background: #fafafa; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
.badge-red { background: #fce4e4; color: #dc3545; }
.badge-orange { background: #fff3e0; color: #e65100; }
.badge-yellow { background: #fff9c4; color: #f57f17; }
.badge-green { background: #e8f5e9; color: #2e7d32; }
.badge-blue { background: #e3f2fd; color: #1565c0; }
.chat-container { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 800px; }
.chat-bubble { margin-bottom: 16px; display: flex; gap: 10px; }
.chat-bubble.user { flex-direction: row-reverse; }
.chat-bubble .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
.chat-bubble.user .avatar { background: #722F37; color: #fff; }
.chat-bubble.assistant .avatar { background: #e3f2fd; color: #1565c0; }
.chat-bubble .msg { padding: 12px 16px; border-radius: 12px; max-width: 600px; font-size: 0.85rem; line-height: 1.5; }
.chat-bubble.user .msg { background: #722F37; color: #fff; border-bottom-right-radius: 4px; }
.chat-bubble.assistant .msg { background: #f5f5f5; color: #333; border-bottom-left-radius: 4px; }
.success-banner { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px; padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.success-banner .icon { font-size: 1.2rem; }
.success-banner .text { font-size: 0.85rem; color: #2e7d32; }

let currentStore = 'S001';
let charts = {};

function fmt(n) { return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function fmtK(n) { return n >= 1000 ? '$' + (n/1000).toFixed(1) + 'k' : fmt(n); }
function fmtPct(n) { return n.toFixed(1) + '%'; }
function fmtInt(n) { return n.toLocaleString('en-US'); }

function switchStore(id) {
  currentStore = id;
  renderActivePage();
}

function switchTab(page) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab[data-page="${page}"]`).classList.add('active');
  document.getElementById('page-' + page).classList.add('active');
  renderActivePage();
}

function getActivePage() {
  const active = document.querySelector('.tab.active');
  return active ? active.dataset.page : 'pos';
}

function renderActivePage() {
  destroyCharts();
  const page = getActivePage();
  switch(page) {
    case 'pos': renderPOS(); break;
    case 'inventory': renderInventory(); break;
    case 'deadstock': renderDeadStock(); break;
    case 'demand': renderDemand(); break;
    case 'recommender': renderRecommender(); break;
    case 'distributor': renderDistributor(); break;
  }
}

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

// --- POS Dashboard ---
function renderPOS() {

  const el = document.getElementById('page-pos');
  el.innerHTML = `
    <div class="metrics">
      <div class="metric-card"><div class="label">Revenue (30d)</div><div class="value">${fmt(kpi.revenue)}</div></div>
      <div class="metric-card"><div class="label">Transactions</div><div class="value">${fmtInt(kpi.txns)}</div></div>
      <div class="metric-card"><div class="label">Avg Basket</div><div class="value">${fmt(kpi.avg_basket)}</div></div>
      <div class="metric-card"><div class="label">Units Sold</div><div class="value">${fmtInt(kpi.units)}</div></div>
      <div class="metric-card"><div class="label">Gross Margin %</div><div class="value">${fmtPct(marginPct)}</div></div>
    </div>
    <div class="chart-row">
      <div class="chart-container"><h3>Daily Revenue & Margin Trend</h3><canvas id="posTrendChart"></canvas></div>
      <div class="chart-container"><h3>Revenue by Category</h3><canvas id="posCatChart"></canvas></div>
    </div>
    <div class="table-wrap"><h3>Top 10 Products</h3><table id="posTable"><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Revenue</th><th>Units</th><th>Margin %</th></tr></thead><tbody></tbody></table></div>
  `;
  // Trend chart

      ]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + (v/1000).toFixed(0) + 'k' } } } }
  });
  // Category chart
  const cats = window.DATA.pos_categories[currentStore];
  const catColors = ['#722F37','#b8860b','#4a148c','#0d47a1','#2e7d32'];
  charts.posCat = new Chart(document.getElementById('posCatChart'), {
    type: 'bar',
    data: {
      labels: cats.map(c => c.category),
      datasets: [{ label: 'Revenue', data: cats.map(c => c.revenue), backgroundColor: catColors }]

    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + (v/1000).toFixed(0) + 'k' } } } }

  const tbody = document.querySelector('#posTable tbody');
  window.DATA.pos_top_products[currentStore].forEach(p => {
    tbody.innerHTML += `<tr><td>${p.sku}</td><td>${p.name}</td><td>${p.category}</td><td>${fmt(p.revenue)}</td><td>${fmtInt(p.units)}</td><td>${fmtPct(p.margin_pct)}</td></tr>`;

}

// --- Inventory Alerts ---
function renderInventory() {

  const el = document.getElementById('page-inventory');
  el.innerHTML = `
    <div class="metrics">

  `;
  const tbody = document.getElementById('invTable');
  alerts.forEach(a => {
    let badgeClass = a.status === 'CRITICAL' ? 'badge-orange' : a.status === 'OUT_OF_STOCK' ? 'badge-red' : 'badge-yellow';
    tbody.innerHTML += `<tr><td>${a.sku}</td><td>${a.product}</td><td><span class="badge ${badgeClass}">${a.status.replace('_',' ')}</span></td><td>${a.on_hand}</td><td>${a.reorder_pt}</td><td>${a.days_left.toFixed(1)}</td><td>${a.avg_daily.toFixed(2)}</td></tr>`;
  });
}

// --- Dead Stock ---
function renderDeadStock() {
  const tiers = window.DATA.dead_stock_tiers[currentStore];
  const detail = window.DATA.dead_stock_detail.filter(d => d.store === currentStore);
  const el = document.getElementById('page-deadstock');
  let metricsHtml = '<div class="metrics">';
  const tierColors = { A: 'green', B: 'yellow', C: 'orange' };
  tiers.forEach(t => {
    metricsHtml += `<div class="metric-card ${tierColors[t.tier] || ''}"><div class="label">Tier ${t.tier}: ${t.label}</div><div class="value">${t.sku_count} SKUs</div><div class="sub">Capital: ${fmt(t.capital)}</div></div>`;
  });
  metricsHtml += '</div>';

  el.innerHTML = `
    ${metricsHtml}
    ${detail.length > 0 ? `
    <div class="chart-container"><h3>Capital at Risk by Category (Slow Movers)</h3><canvas id="deadCatChart"></canvas></div>
    <div class="table-wrap"><h3>Slow Mover Detail</h3><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Tier</th><th>Units 90d</th><th>Days No Sale</th><th>On Hand</th><th>Capital</th><th>Action</th></tr></thead><tbody id="deadTable"></tbody></table></div>
    ` : '<div class="success-banner"><span class="icon">&#10003;</span><span class="text">No slow movers or dead stock detected for this store. All inventory is moving well.</span></div>'}
  `;

  if (detail.length > 0) {
    // Group by category
    const catMap = {};
    detail.forEach(d => { catMap[d.category] = (catMap[d.category] || 0) + d.capital; });
    const catLabels = Object.keys(catMap);
    const catVals = Object.values(catMap);
    charts.deadCat = new Chart(document.getElementById('deadCatChart'), {
      type: 'bar',
      data: { labels: catLabels, datasets: [{ label: 'Capital at Risk', data: catVals, backgroundColor: '#fd7e14' }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + v } } } }
    });
    const tbody = document.getElementById('deadTable');
    detail.forEach(d => {
      tbody.innerHTML += `<tr><td>${d.sku}</td><td>${d.product}</td><td>${d.category}</td><td><span class="badge badge-orange">${d.tier}</span></td><td>${d.sold_90d}</td><td>${d.days_no_sale}</td><td>${d.on_hand}</td><td>${fmt(d.capital)}</td><td>${d.action}</td></tr>`;
    });
  }
}

    <div class="table-wrap"><h3>Upcoming Demand Events</h3><table><thead><tr><th>Event</th><th>Date</th><th>Demand Multiplier</th><th>Affected Categories</th></tr></thead><tbody id="demandTable"></tbody></table></div>

}

// --- Distributor Scorecard ---
function renderDistributor() {
  const dists = window.DATA.distributors;
  const detail = window.DATA.distributor_detail;
  const storeDetail = detail.filter(d => d.store === currentStore);
  const totalSpend = dists.reduce((s,d) => s + d.spend, 0);
  const totalPOs = dists.reduce((s,d) => s + d.pos, 0);
  const avgScore = (dists.reduce((s,d) => s + d.score, 0) / dists.length);
  const el = document.getElementById('page-distributor');
  el.innerHTML = `
    <div class="metrics">
      <div class="metric-card"><div class="label"># Distributors</div><div class="value">${dists.length}</div></div>
      <div class="metric-card"><div class="label">Avg Score</div><div class="value">${avgScore.toFixed(1)}</div></div>
      <div class="metric-card"><div class="label">Total Spend</div><div class="value">${fmt(totalSpend)}</div></div>
      <div class="metric-card"><div class="label">Total POs</div><div class="value">${fmtInt(totalPOs)}</div></div>
    </div>
    <div class="chart-container"><h3>Composite Score by Distributor</h3><canvas id="distChart"></canvas></div>
    <div class="table-wrap"><h3>Overall Scorecard</h3><table><thead><tr><th>Distributor</th><th>Fill Rate %</th><th>On-Time %</th><th>Accuracy %</th><th>Invoice Error %</th><th>Score</th><th>POs</th><th>Spend</th></tr></thead><tbody id="distTable"></tbody></table></div>
    <div class="table-wrap"><h3>Per-Store Breakdown (${window.DATA.stores.find(s=>s.id===currentStore).name})</h3><table><thead><tr><th>Distributor</th><th>Fill %</th><th>On-Time %</th><th>Accuracy %</th><th>Inv Error %</th><th>Score</th><th>Tier</th><th>Spend</th></tr></thead><tbody id="distDetailTable"></tbody></table></div>
  `;
  // Chart
  const sortedDists = [...dists].sort((a,b) => b.score - a.score);
  charts.dist = new Chart(document.getElementById('distChart'), {
    type: 'bar',
    data: {
      labels: sortedDists.map(d => d.name.length > 20 ? d.name.substring(0,20) + '...' : d.name),
      datasets: [{ label: 'Score', data: sortedDists.map(d => d.score), backgroundColor: sortedDists.map(d => d.score >= 80 ? '#28a745' : d.score >= 75 ? '#ffc107' : '#dc3545') }]
    },
    options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { min: 70, max: 85 } } }
  });
  // Overall table
  const tbody = document.getElementById('distTable');
  dists.forEach(d => {
    tbody.innerHTML += `<tr><td>${d.name}</td><td>${fmtPct(d.fill_rate)}</td><td>${fmtPct(d.on_time)}</td><td>${fmtPct(d.accuracy)}</td><td>${fmtPct(d.invoice_error)}</td><td><strong>${d.score.toFixed(1)}</strong></td><td>${d.pos}</td><td>${fmt(d.spend)}</td></tr>`;
  });
  // Store detail table
  const dtbody = document.getElementById('distDetailTable');
  storeDetail.sort((a,b) => b.score - a.score).forEach(d => {
    dtbody.innerHTML += `<tr><td>${d.name}</td><td>${fmtPct(d.fill)}</td><td>${fmtPct(d.on_time)}</td><td>${fmtPct(d.accuracy)}</td><td>${fmtPct(d.inv_error)}</td><td><strong>${d.score.toFixed(1)}</strong></td><td><span class="badge badge-green">${d.tier}</span></td><td>${fmt(d.spend)}</td></tr>`;
  });
}
